<html>
<head>
<title>STUDENT REGISTRATION FORM</title>
<style>
body{
font-family:Arial,sans-serif;
background-color:#f2f2f2;
}
h2{
text-align:center;
color:#333;
}
form{
width:70%;
margin:20px auto;
background:#fff;
border-radius:8px;
box-shadow:0010px rgba(0,0,0,0.1);
}
table{
width:100%;
border-spacing:12px;
}
td{
padding:8px;
vertical-al;ing:top;
}
label{
      font-weight:bold;
      }
input[type="text"],
      input[type="email"],
      input[type="number"],
      input[type="date"],
      select,
           textarea{
           width:100%;
           padding:8px;
           border:1px solid #ccc;
           border:radius:4px;
       }
       input[type="file"]{
        border:none;
       }
       input[type="submit"]
       input[type="reset"]{
        background-color:#4CAF50;
        color:white;
        border:none;
        padding:10px 20px;
        border-radius:4px cursor:pointer;
        }
        input[type="submit"]:hover,
        input[type="reset"]:hover,{
         opacity:0.9;}
         </style>
         </head>
         <body>
         <h2>STUDENT REGISTRATION FORM</h2>
         <form>
         <table>
         <tr>
         <td><label for="fullname">FULL NAME:</label></td>
         <td><input type="text" id="fullname"required></td>
        </tr>
        <tr>
        <td><label for="email">Email:</label></td>
        <td><input type="email"name"email"required></td>
        </tr>
        <tr>
        <td><label for="phone">Phone Number:</label></td>
        <td><input type="tel"id="phone"name="phone"placeholder="+91-xxxxxxxxxx"
        required</td>
        </tr>
        <tr>
        <td><label for="dob">Date of birth:</label></td>
        <td><input type="date"id="dob"name="dob"required></td>
        </tr>
        <tr>
        <td><label>Gender:</label></td>
        <td>
        <input type="radio"id="male"name="gender"value="male">
        <label for="male">male</label>
        <input type="radio"id="female"name="gender"value="female">
        <label for="female">female</label>
        <input type="radio"id="other"name="gender"value="other">
         <label for="other">other</label>
         </td>
         </tr>
         <tr>
         <td><label for="course">Select course:</label></td>
          <td>
          <select id="course" name="course">
          <option value="">--select--</option>
          <option value="bca">BCA</option>
          <option value="bsc">BSC</option>  
          <option value="bcom">B COM</option>
          <option value="ba">BA</option>
          <select>
          </td>
          </tr>
          <tr>
          <td><label>Hobbies:</label></td>
          <td>
          <input type="checkbox" id="reading"name="hobby"value="reading">
          <label for="reading">Reading</label>
           <input type="checkbox" id="sports"name="hobby"value="sports">
          <label for="sports">sports</label>
           <input type="checkbox" id="music"name="hobby"value="music">
          <label for="music">Music</label>
          </td>
          </tr>
          <tr>
          <td><label for="address">Address:</label></td>
          <td><textarea id="address"name="address"rows="4"></textarea></td>
          </td>
          </tr>
          <tr>
             <td><label for="photo">upload photo:</label></td>
          <td><input type="file"id="photo"name="photo"></td>
          </tr>
          <tr>
          <td>
          </td>
          <td>
          <input type="submit" value="Register">
          <input type="reset"value="Reset">
          </td>
          </tr>
          </table>
          </form>
          </body>
          </html>
